<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Meus Treinos</title><style>:root{color-scheme:dark;font-family:system-ui,Arial;background:#171717;color:#f6f4f2}*{box-sizing:border-box}body{margin:0 auto;max-width:760px;padding:16px 16px 95px}h1{font-size:26px;margin:8px 0}h2{font-size:20px}small,.muted{color:#aaa}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;background:#df8739;color:#16110d;padding:12px 15px;font-weight:650;cursor:pointer}button.secondary{background:#393330;color:#fff}button.danger{background:#61312d;color:#fff}button:disabled{opacity:.4}.tabs{display:flex;gap:8px;position:sticky;top:0;background:#171717;padding:12px 0;z-index:2}.tabs button{flex:1}.tabs button.active{background:#df8739;color:#16110d}.panel{background:#292522;border-radius:17px;padding:16px;margin:12px 0}.exercise{border-top:1px solid #49423f;padding:15px 0}.exercise:first-child{border-top:0}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.row{display:flex;align-items:center;gap:7px;margin:9px 0;flex-wrap:wrap}.row input{width:79px}.row label{font-size:13px;color:#bbb}input,select,textarea{background:#1c1a19;color:white;border:1px solid #605852;border-radius:9px;padding:10px;max-width:100%}input[type=date]{width:170px}input[type=checkbox]{width:22px;height:22px;accent-color:#df8739}textarea{width:100%;min-height:70px}.tiny{padding:8px 11px;font-size:13px}.full{width:100%;margin-top:8px}.chip{font-size:12px;color:#e8b17f}.setrow{display:grid;grid-template-columns:25px minmax(65px,1fr) minmax(65px,1fr) 30px 35px;align-items:center;gap:7px;margin:8px 0}.setrow input[type=number]{width:100%;min-width:0}.setrow button{padding:7px 0}.history{border-bottom:1px solid #514a46;padding:12px 0}.history:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.timer{position:fixed;bottom:0;left:0;right:0;background:#27221f;padding:12px;text-align:center;border-top:1px solid #665344;z-index:3}.timer button{margin-left:6px}.hidden{display:none}.notice{font-size:13px;color:#bdb5af}.stat{color:#e9a66e;font-weight:700}details summary{cursor:pointer;padding:5px 0}#file{display:none}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="theme-color" content="#171717"></head><body><header><h1>Meus Treinos</h1><div class="muted">Força e hipertrofia · registro pessoal</div></header><nav class="tabs"><button id="tab-train" onclick="page='train';render()">Treinar</button><button id="tab-history" onclick="page='history';render()">Histórico</button><button id="tab-manage" onclick="page='manage';render()">Editar</button></nav><main id="app"></main><div class="timer"><span id="clock">Descanso: parado</span><button class="tiny secondary" onclick="startTimer(60)">1 min</button><button class="tiny secondary" onclick="startTimer(90)">1m30</button><button class="tiny secondary" onclick="stopTimer()">Parar</button></div><input id="file" type="file" accept="application/json" onchange="importData(event)"><script>
const KEY='treinos_hugo_v1';const initial={plans:[{id:'A',day:'Seg',ex:[{id:'a1',name:'Agachamento (barra)',sets:[[5,55],[5,90],[5,85],[5,85]],note:'37,5 max; 35 depois 32,5'},{id:'a2',name:'Remada (barra)',sets:[[8,60],[8,60],[8,60]],note:'25 cada lado próxima'},{id:'a3',name:'Puxada com Pegada Aberta (barra fixa)',sets:[[5,0],[5,0],[5,0]],note:'Carga 0 = peso corporal'},{id:'a4',name:'Rosca Martelo (halteres)',sets:[[10,18],[8,18],[8,18]],note:'Carga por halter'},{id:'a5',name:'Rosca Scott (máquina)',sets:[[8,36],[8,36],[8,36]],note:''}]},{id:'B',day:'Qua',ex:[{id:'b1',name:'Supino Reto (barra)',sets:[[5,80],[5,80],[5,80]],note:'30 kg; referência 3–5 repetições'},{id:'b2',name:'Paralelas (máquina)',sets:[[10,90],[10,90],[10,90]],note:''},{id:'b3',name:'Extensão de Tríceps (polia)',sets:[[8,31.8],[8,31.8],[8,31.8]],note:'10 no grande'},{id:'b4',name:'Elevação de Panturrilha Sentado (máquina)',sets:[[18,117],[18,117],[18,117]],note:'108 no horizontal; faixa 16–20 repetições'},{id:'b5',name:'Pé na Barra (barra fixa)',sets:[[0,0],[0,0],[0,0]],note:'Repetições não informadas nas imagens'}]},{id:'C',day:'Sex',ex:[{id:'c1',name:'Levantamento Terra (barra)',sets:[[5,150],[5,160]],note:'65 + 15; faixa 150–160 kg'},{id:'c2',name:'Elevação Lateral (halteres)',sets:[[10,12],[10,12],[10,12]],note:''},{id:'c3',name:'Desenvolvimento de Ombros Sentado (máquina)',sets:[[10,25],[10,25],[10,25]],note:'25 kg cada lado'},{id:'c4',name:'Extensão de Pernas (máquina)',sets:[[10,80],[10,80],[10,80]],note:''}]}],history:[]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{data=structuredClone(initial)};if(!data.plans||!Array.isArray(data.history))data=structuredClone(initial);let page='train',selected='A',draft=null,seconds=0,timer=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const plan=()=>data.plans.find(p=>p.id===selected);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const num=v=>Number.isFinite(+v)?+v:0;const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function render(){['train','history','manage'].forEach(x=>$('tab-'+x).classList.toggle('active',page===x));if(page==='train')renderTrain();if(page==='history')renderHistory();if(page==='manage')renderManage()}
function choose(id){selected=id;draft=null;render()};function begin(){let p=plan();draft={id:uid(),plan:selected,date:today(),items:p.ex.map(e=>({id:e.id,name:e.name,sets:e.sets.map(s=>({reps:s[0],kg:s[1],done:false}))}))};render()}
function renderTrain(){let p=plan();let html='<div class="actions">'+data.plans.map(x=>`<button class="${selected===x.id?'':'secondary'}" onclick="choose('${esc(x.id)}')">Treino ${esc(x.id)} · ${esc(x.day)}</button>`).join('')+'</div>';if(!draft){html+=`<div class="panel"><h2>Treino ${esc(p.id)}</h2><p class="muted">${p.ex.length} exercícios</p><button class="full" onclick="begin()">Iniciar treino</button></div>`;p.ex.forEach(e=>html+=`<div class="panel"><b>${esc(e.name)}</b><div class="muted">${e.sets.map(s=>`${s[0]} reps × ${s[1]} kg`).join(' · ')}</div>${e.note?`<small>${esc(e.note)}</small>`:''}</div>`)}else{html+=`<div class="panel"><div class="line"><h2>Treino ${esc(draft.plan)} em andamento</h2><input type="date" value="${esc(draft.date)}" onchange="draft.date=this.value"></div><p class="notice">Marque cada série concluída. Carga 0 pode representar peso corporal.</p></div>`;draft.items.forEach((e,i)=>{html+=`<div class="panel"><div class="line"><b>${esc(e.name)}</b><button class="tiny secondary" onclick="addSet(${i})">+ Série</button></div>`;e.sets.forEach((s,j)=>html+=`<div class="setrow"><small>${j+1}</small><input aria-label="Repetições" type="number" min="0" step="1" value="${s.reps}" onchange="editSet(${i},${j},'reps',this.value)"><input aria-label="Quilos" type="number" min="0" step="0.1" value="${s.kg}" onchange="editSet(${i},${j},'kg',this.value)"><input aria-label="Concluída" type="checkbox" ${s.done?'checked':''} onchange="editSet(${i},${j},'done',this.checked)"><button class="tiny danger" onclick="removeSet(${i},${j})">×</button></div>`);html+='<div class="muted" style="font-size:12px">Repetições · kg · concluída · excluir</div></div>'});html+=`<div class="panel"><button class="full" onclick="finish()">Salvar treino realizado</button><button class="full secondary" onclick="if(confirm('Descartar o treino não salvo?')){draft=null;render()}">Descartar sessão</button></div>`} $('app').innerHTML=html}
function editSet(i,j,k,v){draft.items[i].sets[j][k]=k==='done'?v:num(v)}function addSet(i){let s=draft.items[i].sets.at(-1)||{reps:10,kg:0};draft.items[i].sets.push({...s,done:false});render()}function removeSet(i,j){draft.items[i].sets.splice(j,1);render()}
function finish(){if(!draft.date){alert('Informe a data');return}let completed=draft.items.some(e=>e.sets.some(s=>s.done));if(!completed&&!confirm('Nenhuma série marcada como concluída. Salvar mesmo assim?'))return;data.history.unshift(structuredClone(draft));let p=plan();draft.items.forEach(e=>{let original=p.ex.find(x=>x.id===e.id);if(original){let done=e.sets.filter(s=>s.done);if(done.length)original.sets=done.map(s=>[s.reps,s.kg])}});save();draft=null;page='history';render()}
function renderHistory(){let html=`<div class="panel"><h2>Histórico de treinos</h2><div class="muted">${data.history.length} sessões registradas</div></div>`;if(!data.history.length)html+='<p class="muted">Nenhum treino registrado ainda.</p>';data.history.forEach((h,i)=>{let volume=h.items.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+s.reps*s.kg,0),0);html+=`<div class="panel"><div class="line"><b>Treino ${esc(h.plan)} · ${esc(h.date)}</b><span class="stat">${Math.round(volume)} kg · reps</span></div><details><summary>Ver séries</summary>${h.items.map(e=>`<div class="history"><b>${esc(e.name)}</b><div class="muted">${e.sets.filter(s=>s.done).map(s=>`${s.reps} × ${s.kg} kg`).join(' · ')||'Sem séries concluídas'}</div></div>`).join('')}</details><button class="tiny danger" onclick="deleteHistory(${i})">Excluir registro</button></div>`});$('app').innerHTML=html}
function deleteHistory(i){if(confirm('Excluir este registro do histórico?')){data.history.splice(i,1);save();render()}}
function renderManage(){let html='<div class="actions">'+data.plans.map(x=>`<button class="${selected===x.id?'':'secondary'}" onclick="choose('${esc(x.id)}')">Treino ${esc(x.id)}</button>`).join('')+'</div><div class="panel"><h2>Editar treino '+esc(selected)+'</h2><p class="notice">As alterações afetam os próximos treinos, sem modificar o histórico.</p>';plan().ex.forEach((e,i)=>{html+=`<div class="exercise"><div class="line"><b>${esc(e.name)}</b><div class="actions"><button class="tiny secondary" onclick="moveExercise(${i},-1)">↑</button><button class="tiny secondary" onclick="moveExercise(${i},1)">↓</button><button class="tiny danger" onclick="deleteExercise(${i})">Excluir</button></div></div><label class="muted">Nome</label><input style="width:100%" value="${esc(e.name)}" onchange="updateExercise(${i},'name',this.value)"><div class="row"><label>Séries <input type="number" min="1" max="20" value="${e.sets.length}" onchange="setCount(${i},this.value)"></label><label>Reps <input type="number" min="0" value="${e.sets[0]?.[0]??0}" onchange="setAll(${i},0,this.value)"></label><label>Carga (kg) <input type="number" min="0" step="0.1" value="${e.sets[0]?.[1]??0}" onchange="setAll(${i},1,this.value)"></label></div><label class="muted">Observações</label><input style="width:100%" value="${esc(e.note)}" onchange="updateExercise(${i},'note',this.value)"></div>`});html+=`<button class="full" onclick="addExercise()">+ Adicionar exercício</button></div><div class="panel"><h2>Seus dados</h2><p class="notice">Os registros ficam salvos neste navegador e neste dispositivo. Faça backups regularmente; limpar os dados do navegador pode apagar o histórico.</p><div class="actions"><button onclick="exportData()">Exportar backup</button><button class="secondary" onclick="$('file').click()">Importar backup</button></div><button class="tiny danger" style="margin-top:16px" onclick="resetData()">Restaurar configuração inicial</button></div>`;$('app').innerHTML=html}
function updateExercise(i,k,v){plan().ex[i][k]=v;save()}function setCount(i,v){let e=plan().ex[i],n=Math.max(1,Math.min(20,Math.floor(num(v))));while(e.sets.length<n)e.sets.push([...(e.sets.at(-1)||[10,0])]);e.sets.length=n;save();render()}function setAll(i,k,v){plan().ex[i].sets.forEach(s=>s[k]=num(v));save();render()}function moveExercise(i,delta){let a=plan().ex,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}function deleteExercise(i){if(confirm('Retirar este exercício do treino?')){plan().ex.splice(i,1);save();render()}}function addExercise(){let name=prompt('Nome do novo exercício:');if(!name?.trim())return;plan().ex.push({id:uid(),name:name.trim(),sets:[[10,0],[10,0],[10,0]],note:''});save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup_meus_treinos_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}async function importData(ev){let f=ev.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.plans)||!Array.isArray(d.history))throw Error('Formato inválido');if(confirm('Substituir todos os treinos e histórico pelos dados do backup?')){data=d;save();draft=null;selected=data.plans[0]?.id||'A';render()}}catch(e){alert('Não foi possível importar: '+e.message)}ev.target.value=''}function resetData(){if(confirm('Restaurar os treinos originais e APAGAR todo o histórico?')){data=structuredClone(initial);save();draft=null;selected='A';render()}}
function stopTimer(){clearInterval(timer);timer=null;seconds=0;$('clock').textContent='Descanso: parado'}function startTimer(s){clearInterval(timer);seconds=s;tick();timer=setInterval(()=>{seconds--;tick();if(seconds<=0){clearInterval(timer);timer=null;try{navigator.vibrate?.([200,100,200])}catch{}}},1000)}function tick(){$('clock').textContent=seconds<=0?'Descanso concluído':`Descanso: ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`};render();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
